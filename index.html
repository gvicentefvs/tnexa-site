<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <link
      rel="icon"
      type="image/jpeg"
      href="/assets/images/logo-tnexa.jpeg"
    />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="description"
      content="TNEXA desenvolve soluções em tecnologia, automação, sistemas, integração e inteligência digital para empresas. Tecnologia que conecta. Inteligência que transforma."
    />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <meta name="author" content="TNEXA" />

    <meta
      name="keywords"
      content="TNEXA, tecnologia, automação, sistemas, desenvolvimento de sistemas, soluções digitais, integração de sistemas, inteligência artificial, transformação digital, tecnologia empresarial, Sorocaba"
    />

    <!-- URL CANÔNICA -->
    <link
      rel="canonical"
      href="https://www.tnexa.com.br/"
    />

    <title>
      TNEXA | Tecnologia, Automação e Soluções Digitais
    </title>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="TNEXA" />

    <meta
      property="og:title"
      content="TNEXA | Tecnologia, Automação e Soluções Digitais"
    />

    <meta
      property="og:description"
      content="Tecnologia que conecta. Inteligência que transforma. A TNEXA desenvolve soluções em tecnologia, automação, sistemas, integração e inteligência digital."
    />

    <meta
      property="og:url"
      content="https://www.tnexa.com.br/"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary" />

    <meta
      name="twitter:title"
      content="TNEXA | Tecnologia, Automação e Soluções Digitais"
    />

    <meta
      name="twitter:description"
      content="Tecnologia que conecta. Inteligência que transforma."
    />

    <!-- Dados estruturados da empresa -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "TNEXA",
        "url": "https://www.tnexa.com.br/",
        "logo": "https://www.tnexa.com.br/assets/images/logo-tnexa.jpeg",
        "description": "Empresa de tecnologia especializada em automação, sistemas, integração e soluções digitais.",
        "sameAs": []
      }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="bg-bg-900">
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
